# CONFIGURACIÓN DEL SERVIDOR
server.port=8081
# http://localhost:8081/swagger-ui/index.html

# NOMBRE DE LA APLICACIÓN (Útil para Swagger)
spring.application.name=PawParkBackend
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# 1. Database Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/bd_pawpark?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURACIÓN JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# 'update': Crea/actualiza las tablas automáticamente al iniciar
spring.jpa.hibernate.ddl-auto=create
# Mostrar las consultas SQL en la consola (útil para depurar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Añadimos estas dos líneas para permitir archivos de hasta 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB